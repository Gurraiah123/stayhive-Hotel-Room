<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StayHive — Budget stays, sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="#" class="logo">Stay<span>Hive</span></a>
    <nav class="header-actions">
      <button id="loginBtn" class="btn btn-ghost">Log in</button>
      <button id="signupBtn" class="btn btn-primary">Sign up</button>
      <button id="myBookingsBtn" class="btn btn-ghost hidden">My bookings</button>
      <button id="logoutBtn" class="btn btn-ghost hidden">Log out</button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-mosaic" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="wrap hero-content">
    <p class="eyebrow">1,200+ verified budget stays</p>
    <h1>A clean room and<br>a fair price, guaranteed.</h1>
    <form id="searchForm" class="search-card">
      <div class="field">
        <label for="cityInput">City</label>
        <input id="cityInput" type="text" placeholder="Where to?" value="Goa" required>
      </div>
      <div class="field">
        <label for="checkIn">Check-in</label>
        <input id="checkIn" type="date" value="2026-08-01" required>
      </div>
      <div class="field">
        <label for="checkOut">Check-out</label>
        <input id="checkOut" type="date" value="2026-08-02" required>
      </div>
      <div class="field field-narrow">
        <label for="guests">Guests</label>
        <input id="guests" type="number" min="1" max="8" value="2" required>
      </div>
      <button type="submit" class="btn btn-primary search-btn">Search stays</button>
    </form>
  </div>
</section>

<main class="wrap">
  <div class="results-header">
    <h2 id="resultsTitle">Search for a city to see stays</h2>
    <p id="resultsMeta" class="muted"></p>
  </div>
  <div id="resultsGrid" class="results-grid"></div>
</main>

<!-- Hotel detail / booking modal -->
<dialog id="hotelModal" class="modal">
  <div class="modal-inner">
    <button id="closeModal" class="modal-close" aria-label="Close">&times;</button>
    <div id="modalContent"></div>
  </div>
</dialog>

<!-- Auth modal -->
<dialog id="authModal" class="modal">
  <div class="modal-inner modal-narrow">
    <button id="closeAuthModal" class="modal-close" aria-label="Close">&times;</button>
    <div id="authContent"></div>
  </div>
</dialog>

<div id="toast" class="toast hidden"></div>

<footer class="site-footer">
  <div class="wrap">
    <p>StayHive — a demo hotel-booking clone built for learning purposes. Not affiliated with any real hotel brand.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
